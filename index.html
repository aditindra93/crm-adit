:root{

  --track:rgba(110,126,165,.2);--track2:rgba(110,126,165,.45);
  --glass:rgba(255,255,255,.34);--glass-strong:rgba(255,255,255,.56);--glass-border:rgba(255,255,255,.7);
  --field:rgba(205,214,232,.38);--btn:rgba(255,255,255,.5);--trough:rgba(140,156,196,.16);--hover:rgba(255,255,255,.45);

  --sh:9px 9px 22px var(--nu-lo),-8px -8px 20px var(--nu-hi);
  --sh-sm:5px 5px 12px var(--nu-lo),-4px -4px 10px var(--nu-hi);
  --sh-xs:3px 3px 7px var(--nu-lo),-3px -3px 7px var(--nu-hi);
  --sh-in:inset 4px 4px 9px var(--nu-lo),inset -4px -4px 9px var(--nu-hi);
  --sh-in-sm:inset 2px 2px 5px var(--nu-lo),inset -2px -2px 5px var(--nu-hi);
  --shadow:0 12px 32px rgba(50,66,112,.24);
  --blob1:rgba(122,162,255,.55);--blob2:rgba(206,160,255,.5);--blob3:rgba(120,225,205,.5);--blob4:rgba(255,190,140,.45);
  --lg-bg:rgba(14,24,52,.3);--lg-strong:rgba(54,28,44,.4);--lg-bd:rgba(255,255,255,.34);--wall-dim:0;

}

/* ---------- Lockscreen (iPadOS) ---------- */
#lock{position:fixed;inset:0;z-index:60;overflow:auto;color:#fff;background:#06203f;padding:clamp(16px,3.4vh,38px) max(16px,env(safe-area-inset-right,0px)) clamp(14px,3vh,30px) max(16px,env(safe-area-inset-left,0px));text-shadow:0 1px 12px rgba(0,0,0,.14)}

.lk{position:relative;z-index:1;max-width:1320px;min-height:100%;margin:0 auto;display:grid;grid-template-columns:minmax(250px,300px) minmax(0,1fr) minmax(250px,300px);gap:28px}
.lk-theme{position:fixed;z-index:3;top:max(14px,env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:50%;border:1px solid var(--lg-bd);background:var(--lg-bg);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;cursor:pointer;display:grid;place-items:center}
.lk-theme svg{width:19px;height:19px}
.lk-left{display:flex;flex-direction:column;gap:14px;align-self:start;min-width:0}

.lk-top{text-align:center;margin-top:clamp(0px,1.5vh,12px)}
.lk-date{font-size:clamp(17px,2.1vw,24px);font-weight:600;letter-spacing:.01em}
.lk-time{font-size:clamp(84px,13vw,160px);font-weight:700;line-height:.98;letter-spacing:-.035em;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#fff 20%,rgba(255,255,255,.6) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 6px 24px rgba(0,0,0,.24))}
.lk-bottom{width:min(540px,100%);display:flex;flex-direction:column;gap:12px}
.lg{background:var(--lg-bg);border:1px solid var(--lg-bd);-webkit-backdrop-filter:blur(28px) saturate(1.6);backdrop-filter:blur(28px) saturate(1.6);border-radius:26px;padding:14px 16px;min-width:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 12px 30px rgba(0,0,0,.16)}
.lg h4{margin:0 0 8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;opacity:.8}
.clk-row{display:grid;grid-template-columns:128px minmax(0,1fr);gap:12px;align-items:center;padding:12px}
.clk-row .clk{width:128px}
.pry{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:12px}
.pry .nx{display:flex;flex-direction:column;gap:1px;margin-bottom:5px}
.pry .nx small{opacity:.75;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.pry .nx b{font-size:18px;white-space:nowrap;line-height:1.1;font-weight:650;font-variant-numeric:tabular-nums}
.pry .nx span{opacity:.85;font-size:11px}
.pry .pl{display:flex;justify-content:space-between;gap:8px;opacity:.75;font-variant-numeric:tabular-nums;font-size:11.5px;line-height:1.5}
.pry .pl.on{opacity:1;font-weight:700;color:#ffd166}
.pry .loc{opacity:.6;font-size:10px;margin-top:3px}
.lk-right .nc-h{padding-right:50px;min-height:40px}
.lk-right{display:flex;flex-direction:column;gap:10px;align-self:start;min-width:0}
.nc-ic.k{background:linear-gradient(145deg,#34c759,#12875a);font-weight:700;font-size:18px}
.nc-head.static{cursor:default}
.nc-card.kcur .nc-body{padding-top:0}

/* cuaca */
.wx{display:flex;flex-direction:column;gap:6px}
.wx-loc{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;min-width:0}
.wx-loc span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wx-loc svg{width:12px;height:12px;flex:none}
.wx-loc small{opacity:.7;font-weight:500;font-size:11px;white-space:nowrap}
.wx-main{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.wx-temp{font-size:56px;font-weight:600;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.wx-side{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:12px;text-align:right;padding-bottom:4px}
.wx-cond{display:flex;align-items:center;gap:5px;font-weight:600}

.wx-aqi{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;border-top:1px solid rgba(255,255,255,.22);padding-top:8px;margin-top:2px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
/* jam analog */
.clk{display:grid;place-items:center;aspect-ratio:1;width:min(150px,100%)}
.aclock{width:100%;height:100%;display:block}
.aclock .tk{stroke:rgba(255,255,255,.55);stroke-width:.8;stroke-linecap:round}

.aclock .h1{stroke-width:3.2}.aclock .h2{stroke-width:2.2}
.aclock .h3{stroke:#ff9f0a;stroke-width:1;stroke-linecap:round}
.aclock .hub{fill:#fff}.aclock .hub2{fill:#ff9f0a}
/* kurs */
.kurs{display:flex;flex-direction:column;gap:7px}
.kurs div{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px}
.kurs strong{font-size:15px;font-variant-numeric:tabular-nums}

/* kalender */
.cal-title{display:flex;justify-content:space-between;font-weight:600;margin-bottom:6px;font-size:13px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center;font-size:12px}

.cal span.today{background:#fff;color:#16203f;font-weight:700;text-shadow:none}
.cal span.due::after{content:"";position:absolute;left:50%;bottom:0;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#ffd166}
.cal span.today.due::after{background:#e2672f}

.nc-h{display:flex;align-items:center;justify-content:space-between;font-size:20px;font-weight:500;padding:0 4px}
.nc-close{width:30px;height:30px;border-radius:50%;border:1px solid var(--lg-bd);background:var(--lg-bg);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:#fff;cursor:pointer;display:grid;place-items:center}
.nc-close svg{width:14px;height:14px}
#ncList{display:flex;flex-direction:column;gap:8px}
.nc-card{background:var(--lg-strong);border:1px solid var(--lg-bd);border-radius:20px;-webkit-backdrop-filter:blur(26px) saturate(1.5);backdrop-filter:blur(26px) saturate(1.5);overflow:hidden}
.nc-head{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:inherit;text-align:left;padding:11px 14px;cursor:pointer;text-shadow:inherit}
.nc-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#5ac8fa,#0a84ff);flex:none}
.nc-ic.q{background:linear-gradient(145deg,#ffb340,#ff7a1a)}
.nc-ic svg{width:19px;height:19px}
.nc-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nc-row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.nc-row small{opacity:.75;font-size:11.5px;white-space:nowrap}
.nc-sub{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.95}
.nc-chev{flex:none;display:grid;place-items:center;opacity:.8;transition:transform .2s}
.nc-chev svg{width:16px;height:16px}
.nc-card.open .nc-chev{transform:rotate(180deg)}
.nc-card.open .nc-sub.q{white-space:normal;font-size:15px;line-height:1.4}
.nc-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.nc-list{display:flex;flex-direction:column;max-height:min(230px,28vh);overflow:auto;border-top:1px solid rgba(255,255,255,.2);padding-top:6px}
.nc-list label{display:flex;align-items:center;gap:10px;padding:7px 2px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.12)}
.nc-list label:last-child{border-bottom:0}
.nc-list input{width:18px;height:18px;margin:0;accent-color:#fff;flex:none}
.nc-list label span{flex:1;min-width:0}

.nc-x{border:0;background:none;color:#fff;opacity:.65;cursor:pointer;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}

.nc-btn{border:0;border-radius:999px;background:#fff;color:#16203f;font-weight:650;padding:0 16px;cursor:pointer;text-shadow:none}
.nc-card :focus-visible,.nc-close:focus-visible,.lk-theme:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* buka kunci */
.unlock{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 10px;border-radius:999px;background:var(--lg-bg);border:1px solid var(--lg-bd);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);flex-wrap:wrap}
.avatar{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.24);border:1px solid rgba(255,255,255,.4);display:grid;place-items:center;font-size:15px;font-weight:700;flex:none}
.who{flex:1 1 90px;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.who strong{font-size:14px}
#lockMsg{min-height:15px;font-size:11.5px;opacity:.92}
.pw{display:flex;align-items:center;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.32);border-radius:999px;padding:3px 3px 3px 16px;flex:1 1 200px;min-width:0}
.pw input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;padding:8px 0;font-size:14px;box-shadow:none;border-radius:0}

@media (max-width:1100px){.lk{grid-template-columns:minmax(250px,300px) minmax(0,1fr)}.lk-left{grid-row:1/3}.lk-center{grid-column:2}.lk-right{grid-column:2}}

/* ---------- App shell ---------- */
.shell{display:grid;grid-template-columns:228px minmax(0,1fr);height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 16px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand .bt{display:flex;flex-direction:column;min-width:0;line-height:1.2}.brand .bt small{font-size:10.5px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700}
.nav{display:flex;align-items:center;gap:11px;border:0;background:none;text-align:left;padding:9px 10px;border-radius:11px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.nav svg{width:19px;height:19px;flex:none}
.nav:hover{background:var(--surface2);color:var(--fg)}
.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
svg.ic{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.main{overflow:auto;min-width:0;padding:0 max(18px,env(safe-area-inset-right,0px)) 48px max(18px,env(safe-area-inset-left,0px))}
.inner{max-width:1240px;margin:0 auto}
.top{position:sticky;top:0;z-index:8;background:var(--bg);display:flex;align-items:center;gap:10px;padding:16px 0 14px;flex-wrap:wrap}
.top h1{font-size:22px;letter-spacing:-.02em;flex:1;min-width:140px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--muted)}
.chip svg{width:15px;height:15px}
.chip .d{width:8px;height:8px;border-radius:50%;background:var(--track2)}
.chip.saved .d{background:var(--good)}.chip.dirty .d,.chip.saving .d{background:var(--warn)}.chip.error .d{background:var(--bad)}
.icon-btn{position:relative;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--muted);font-size:18px;line-height:1}
.icon-btn svg{width:18px;height:18px}
.icon-btn:hover{color:var(--fg)}
.badge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;font-size:13px}

/* ---------- Components ---------- */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h3{font-size:15px;letter-spacing:-.01em}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:550;white-space:nowrap}
.btn:hover{background:var(--surface2)}

/* ---------- Skin: neumorphism + glassmorphism ---------- */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60vw 55vh at 6% 0%,var(--blob1),transparent 65%),radial-gradient(55vw 55vh at 100% 6%,var(--blob2),transparent 65%),radial-gradient(60vw 60vh at 0% 100%,var(--blob3),transparent 65%),radial-gradient(55vw 55vh at 100% 100%,var(--blob4),transparent 65%)}
.side{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);border-right:1px solid var(--glass-border);box-shadow:8px 0 28px var(--nu-lo)}
.brand i{background:linear-gradient(145deg,var(--accent-hi),var(--accent));color:var(--accent-fg);box-shadow:0 6px 14px var(--accent-glow),-2px -2px 6px var(--nu-hi);border-radius:12px;width:34px;height:34px}
.nav{border-radius:14px;transition:box-shadow .18s,color .18s,background .18s}
.nav:hover{background:var(--hover);color:var(--fg);box-shadow:var(--sh-xs)}
.nav.on{background:var(--field);color:var(--accent);box-shadow:var(--sh-in-sm)}
.top{top:10px;margin:14px 0;padding:10px 16px;border-radius:22px;background:var(--glass);border:1px solid var(--glass-border);box-shadow:var(--sh-sm);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5)}
.top h1{font-size:21px}
.icon-btn,.chip{background:var(--btn);border:1px solid var(--glass-border);box-shadow:var(--sh-xs);transition:box-shadow .15s,transform .15s}
.icon-btn:hover,.chip:hover{box-shadow:var(--sh-sm);color:var(--fg)}
.icon-btn:active,.chip:active{box-shadow:var(--sh-in-sm)}
.card{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--r);box-shadow:var(--sh);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}
.banner{border:1px solid var(--glass-border);box-shadow:var(--sh-xs);border-radius:16px}
.btn{background:var(--btn);border:1px solid var(--glass-border);border-radius:12px;box-shadow:var(--sh-xs);transition:box-shadow .15s,transform .15s}
.btn:hover{background:var(--btn);box-shadow:var(--sh-sm);transform:translateY(-1px)}
.btn:active{box-shadow:var(--sh-in-sm);transform:none}
.btn.primary{background:linear-gradient(145deg,var(--accent-hi),var(--accent));border-color:transparent;color:var(--accent-fg);box-shadow:0 8px 18px var(--accent-glow),-3px -3px 8px var(--nu-hi)}
.btn.primary:hover{filter:none;box-shadow:0 10px 22px var(--accent-glow),-3px -3px 8px var(--nu-hi)}
.btn.primary:active{box-shadow:inset 2px 3px 8px rgba(0,0,0,.28)}
.btn.danger,.mini.danger{color:var(--bad)}
.link{color:var(--accent)}
input:not([type=checkbox]):not([type=radio]),select,textarea{background:var(--field);border:1px solid transparent;border-radius:14px;box-shadow:var(--sh-in-sm)}
input[type=checkbox]{accent-color:var(--accent)}
input:not([type=checkbox]):not([type=radio]):focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.pill{background:var(--field);box-shadow:var(--sh-in-sm)}
.pill.good,.pill.warn,.pill.bad,.pill.acc{box-shadow:none}
.seg{background:var(--field);box-shadow:var(--sh-in-sm);border-radius:14px}
.seg button{border-radius:11px}
.seg button.on{background:var(--btn);color:var(--fg);box-shadow:var(--sh-xs)}
th{background:var(--glass-strong);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
tbody tr{transition:background .15s}
tbody tr:hover td{background:var(--hover)}
td,th{border-bottom-color:var(--line)}
.tbl-wrap{border-radius:16px}
.col{background:var(--trough);box-shadow:var(--sh-in-sm);border-radius:20px}
.kc{background:var(--glass-strong);border:1px solid var(--glass-border);border-radius:14px;box-shadow:var(--sh-xs)}
.kc.click:hover{box-shadow:var(--sh-sm),0 0 0 1.5px var(--accent)}
.mini{background:var(--btn);border-color:var(--glass-border);box-shadow:var(--sh-xs)}
.mini:active:not(:disabled){box-shadow:var(--sh-in-sm)}
.addb{border-color:var(--track2)}
.pcard{background:var(--glass-strong);border:1px solid var(--glass-border);box-shadow:var(--sh-xs);border-radius:16px;transition:box-shadow .15s}

  const iq=[];[['c1',{'MSG 100-200 mesh':5000,'I+G':150,'STPP':2000,'SAPP-28':1500,'GARLIC POWDER':500}],['c2',{'STPP':300,'SAPP-28':200,'POTASSIUM SORBATE':1000,'CALCIUM PROPIONATE':200,'XANTHAN GUM F80':300,'XANTHAN GUM F200':300,'MALTODEXTRIN':20000,'MALIC ACID':5000}],['c3',{'MSG 100-200 mesh':5000,'I+G':500,'SAPP-28':200}]].forEach(([cid,o])=>Object.keys(o).forEach(n=>iq.push({id:uid(),customerId:cid,productId:pid(n),qty:o[n]})));
  return norm({customers:c,products:p,pos,activities:act,plans,pipeline:pl,outstanding:out,overdue:over,samples:samp,todos,budget:bud,inqProducts:ip,inquiries:iq});
}
function ensureBudget(){['value','margin'].forEach(mt=>{for(let i=0;i<12;i++)if(!S.budget.find(b=>b.metric===mt&&b.m===i))S.budget.push({id:mt+'-'+i,metric:mt,m:i,target:0,ach:0})})}
function budgetOf(mt){const t=Array(12).fill(0),a=Array(12).fill(0);S.budget.filter(b=>b.metric===mt).forEach(b=>{t[b.m]=N(b.target);a[b.m]=N(b.ach)});return {t,a}}

let tmr=null,syncState='local',lastErr='';
function setSync(s){syncState=s;const el=$('#syncChip');if(!el)return;
  const label={local:'Hanya di perangkat ini',saved:'Tersimpan di Google Sheet',dirty:'Belum disimpan',saving:'Menyimpan…',error:'Gagal sinkron'}[s];
  el.className='chip '+s;el.innerHTML='<span class="d"></span>'+svg('sheet')+' '+label}
function touch(){persist();if(cfg.url){setSync('dirty');clearTimeout(tmr);tmr=setTimeout(pushSheet,1600)}else setSync('local')}
function explainErr(e,res){
  const m=String(e&&e.message||e);
  if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(cfg.url))return 'URL belum benar. Harus diawali https://script.google.com/macros/s/ dan diakhiri /exec';
  if(e&&e.name==='SyntaxError')return 'Google membalas halaman login. Di Deploy, set "Who has access" ke Anyone, lalu buat deployment baru.';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return 'Browser tidak bisa menjangkau skrip. Cek akses deployment = Anyone, dan buka aplikasi sebagai file di browser (bukan lewat pratinjau di chat).';
  return 'Skrip membalas: '+m}
async function pushSheet(manual){
  if(!cfg.url){if(manual)toast('Hubungkan Google Sheet dulu lewat tombol di kanan atas');return false}
  clearTimeout(tmr);setSync('saving');
  try{const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'save',data:S})});
    const j=await r.json();if(!j.ok)throw new Error(j.error||'gagal');setSync('saved');if(manual)toast('Tersimpan ke Google Sheet');return true}
  catch(e){setSync('error');lastErr=explainErr(e);toast('Gagal menyimpan: '+lastErr);return false}}
async function pullSheet(silent){
  if(!cfg.url)return false;setSync('saving');
  try{const r=await fetch(cfg.url+(cfg.url.includes('?')?'&':'?')+'action=load');const j=await r.json();if(!j.ok)throw new Error(j.error||'gagal');
    const d=norm(j.data);const has=KEYS.some(k=>k!=='budget'&&d[k].length)||d.budget.length;
    if(has){if(!d.inqProducts.length&&!d.inquiries.length){d.inqProducts=S.inqProducts;d.inquiries=S.inquiries}S=d;ensureBudget();cfg.demo=false;jset(LSC,cfg);persist()}
    setSync('saved');if(!silent)toast(has?'Data dimuat dari Google Sheet':'Sheet masih kosong, data lokal dipakai');return true}
  catch(e){setSync('error');lastErr=explainErr(e);if(!silent)toast('Gagal terhubung: '+lastErr);return false}}

function pie(pct,col){const p=Math.max(0,Math.min(100,pct));
  if(p>=99.99)return `<svg viewBox="-60 -60 120 120" role="img" aria-label="${pct.toFixed(0)} persen"><circle r="56" fill="${col}"/></svg>`;
  const a=p/100*2*Math.PI,x=56*Math.sin(a),y=-56*Math.cos(a);
  return `<svg viewBox="-60 -60 120 120" role="img" aria-label="${pct.toFixed(0)} persen"><circle r="56" fill="var(--track)"/>${p>0?`<path d="M0 0 L0 -56 A56 56 0 ${p>50?1:0} 1 ${x.toFixed(2)} ${y.toFixed(2)} Z" fill="${col}" stroke="var(--surface)" stroke-width="2"/>`:''}</svg>`}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function bars(t,a){BUD={t,a};const W=760,H=250,L=56,B=28,T=12,R=8;const max=niceMax(Math.max(...t,...a,1));const cw=(W-L-R)/12,bw=Math.min(18,cw/2.6);
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Budget dan achievement bulanan">`;
  for(let i=0;i<=4;i++){const y=T+(H-T-B)*(1-i/4);s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="ax" x="${L-8}" y="${y+4}" text-anchor="end">${compact(max*i/4)}</text>`}
  for(let i=0;i<12;i++){const cx=L+cw*i+cw/2,ht=(H-T-B)*t[i]/max,ha=(H-T-B)*a[i]/max;
    s+=`<rect class="hit" data-i="${i}" x="${(L+cw*i).toFixed(1)}" y="${T}" width="${cw.toFixed(1)}" height="${H-T-B}"/><rect class="bar-t" x="${(cx-bw-1).toFixed(1)}" y="${(H-B-ht).toFixed(1)}" width="${bw}" height="${ht.toFixed(1)}" rx="3"/><rect class="bar-a" x="${(cx+1).toFixed(1)}" y="${(H-B-ha).toFixed(1)}" width="${bw}" height="${ha.toFixed(1)}" rx="3"/><text class="ax" x="${cx.toFixed(1)}" y="${H-8}" text-anchor="middle">${FYM[i]}</text>`}
  return s+'</svg>'}

  return `<div class="fit-page"><div class="grid g3"><div class="card stat"><span class="lbl">Customer</span><span class="big sm">${custs.length}</span></div><div class="card stat"><span class="lbl">Produk</span><span class="big sm">${prods.length}</span></div><div class="card stat"><span class="lbl">Total inquiry per bulan</span><span class="big sm"><span data-gt2>${nf(grand)}</span> kg</span></div></div>

   ${custs.length&&prods.length?`<div class="tbl-wrap iqwrap" data-keepscroll="iq"><table class="iq">${head}<tbody>${body}</tbody></table></div>`:empty(custs.length?`Belum ada produk. <button class="link" data-act="inqSeed">Muat daftar produk standar</button> atau tambah satu per satu.`:'Belum ada customer. Tambahkan customer di tab Data Customer, kolomnya muncul otomatis di sini.')}</div></div>`}
function iqRefresh(){
  const custs=S.customers,prods=S.inqProducts,m=iqMap(),val=(c,p)=>{const q=m[iqKey(c,p)];return q?q.qty:0};
  const rt={};prods.forEach(p=>rt[p.id]=sum(custs.map(c=>val(c.id,p.id))));

function pageCalc(){const c=UI.calc;
  return `<div class="calc"><div class="card"><div class="card-h"><h3>Biaya per kg</h3></div>
   ${fld('COGS (Rp/kg)',`<input type="number" min="0" step="any" id="cc" data-calc="cogs" value="${esc(c.cogs)}" placeholder="mis. 41500">`)}
   <div class="fld" style="margin-top:12px"><span>Biaya tambahan (Rp/kg)</span>${c.extras.map((x,i)=>`<div class="xrow"><input id="xn${i}" data-calc="xn:${i}" value="${esc(x.n)}" aria-label="Nama biaya"><input type="number" min="0" step="any" id="xv${i}" data-calc="xv:${i}" value="${esc(x.v)}" placeholder="0" aria-label="Nilai biaya"><button class="btn sm" data-act="rmExtra" data-i="${i}" aria-label="Hapus biaya">×</button></div>`).join('')}
   <button class="btn sm" data-act="addExtra" style="align-self:flex-start">+ Tambah biaya</button></div>
   <div class="frow" style="margin-top:16px">${fld('Target margin (%)',`<input type="number" min="0" max="99.9" step="any" id="cm" data-calc="margin" value="${esc(c.margin)}" placeholder="mis. 20">`)}${fld('Target harga jual (Rp/kg)',`<input type="number" min="0" step="any" id="cp" data-calc="price" value="${esc(c.price)}" placeholder="mis. 53000">`)}</div></div>
   <div class="card"><div class="card-h"><h3>Hasil</h3></div><div id="calcOut"></div></div></div>`}
function calcUpdate(){const c=UI.calc,el=$('#calcOut');if(!el)return;
  const cost=N(c.cogs)+sum(c.extras.map(x=>x.v));let h=`<div class="stat" style="margin-bottom:14px"><span class="lbl">Total biaya</span><span class="big sm">${rp(cost)}/kg</span></div>`;
  const m=parseFloat(c.margin),p=parseFloat(c.price);
  if(isFinite(m)&&m>=0&&m<100&&cost>0){const price=cost/(1-m/100);h+=`<div class="card" style="background:var(--accent-soft);box-shadow:none;margin-bottom:10px"><div class="lbl">Harga jual untuk margin ${nf(m,1)}%</div><div class="big">${rp(price)}<span class="muted" style="font-size:14px;font-weight:500">/kg</span></div><div class="muted num">Profit ${rp(price-cost)}/kg · markup ${nf((price-cost)/cost*100,1)}%</div></div>`}
  if(isFinite(p)&&p>0&&cost>0){const mg=(p-cost)/p*100;h+=`<div class="card" style="background:${mg>=0?'var(--good-soft)':'var(--bad-soft)'};box-shadow:none"><div class="lbl">Margin pada harga ${rp(p)}/kg</div><div class="big">${nf(mg,1)}%</div><div class="muted num">Profit ${rp(p-cost)}/kg · markup ${nf((p-cost)/cost*100,1)}%</div></div>`}
  if(!(isFinite(m)&&c.margin!=='')&&!(isFinite(p)&&c.price!==''))h+=`<p class="muted">Isi target margin untuk melihat harga jual, atau isi target harga jual untuk melihat margin. Margin dihitung dari harga jual.</p>`;
  el.innerHTML=h}

const ENT={cust:{arr:'customers',form:formCust,l:'customer'},prod:{arr:'products',form:formProd,l:'produk'},po:{arr:'pos',form:formPO,l:'PO'},act:{arr:'activities',form:formAct,l:'aktivitas'},plan:{arr:'plans',form:formPlan,l:'rencana'},pipe:{arr:'pipeline',form:formPipe,l:'pipeline'},out:{arr:'outstanding',form:formOut,l:'data outstanding'},over:{arr:'overdue',form:formOver,l:'data overdue'},samp:{arr:'samples',form:formSamp,l:'sample'}};
function upsert(arr,o){const i=S[arr].findIndex(x=>x.id===o.id);if(i>=0)S[arr][i]=o;else S[arr].push(o)}
function delEntity(t,id){const e=ENT[t];ask(`Hapus ${e.l} ini? Tindakan ini tidak bisa dibatalkan.`,()=>{
  S[e.arr]=S[e.arr].filter(x=>x.id!==id);

function brandKurs(){const el=$('#brandKurs');if(!el)return;const c=jget('crm_adit_kurs');
  el.textContent=c&&c.r?`USD/IDR ${nf(c.r.USD,0)} · ${c.date===iso(new Date())?'hari ini':fdate(c.date)}`:'USD/IDR belum dimuat'}
function renderSide(){$('#side').innerHTML=`<div class="brand"><i>CRM</i><div class="bt"><b>Adit CRM</b><small id="brandKurs"></small></div></div>`+NAV.map(([k,l])=>`<button class="nav" data-act="go" data-page="${k}" data-nav="${k}">${svg(k)}<span>${l}</span></button>`+(k==='cust'?`<button class="nav sub" data-act="go" data-page="inq" data-nav="inq" hidden>${svg('cust')}<span>Inquiry Customer</span></button>`:'')).join('');brandKurs()}
function render(){
  const ae=document.activeElement,aid=ae&&ae.id,ss=ae&&ae.selectionStart,se=ae&&ae.selectionEnd;
  const keep={};$$('[data-keepscroll]').forEach(e=>keep[e.dataset.keepscroll]=e.scrollLeft);
  const main=$('#main'),st=main.scrollTop;
  $('#view').innerHTML=PAGES[UI.page]();
  $$('[data-keepscroll]').forEach(e=>{if(keep[e.dataset.keepscroll]!==undefined)e.scrollLeft=keep[e.dataset.keepscroll]});
  if(UI.page==='act'&&UI.scrollNow){const w=$('#weeks'),n=$('[data-now]');if(w&&n)w.scrollLeft=Math.max(0,n.offsetLeft-w.offsetLeft-12);UI.scrollNow=false}
  main.scrollTop=st;
  if(aid){const e=document.getElementById(aid);if(e&&e!==document.activeElement){e.focus();try{if(ss!=null)e.setSelectionRange(ss,se)}catch(x){}}}
  main.classList.toggle('fit',['cust','inq','prod','out','over','samp'].includes(UI.page));$('#tip').hidden=true;
  const navKey=UI.page==='budget'?'dash':UI.page;
  $$('.nav').forEach(b=>b.classList.toggle('on',b.dataset.nav===navKey));
  const sb=$('[data-nav=inq]');if(sb)sb.hidden=!(UI.page==='cust'||UI.page==='inq');
  $('#pageTitle').textContent=TITLES[UI.page];
  const nn=notifs().length;$('#bell').innerHTML=svg('bell')+(nn?`<span class="badge">${nn}</span>`:'');
  $('#lockBtn').innerHTML=svg('lock');setThemeIcon();
  $('#banner').innerHTML=cfg.demo?`<div class="banner"><span>Ini data contoh supaya tampilan terlihat hidup. Hapus sebelum mulai mengisi data asli.</span><button class="btn sm" data-act="clearDemo">Hapus data contoh</button></div>`:'';
  if(UI.page==='calc')calcUpdate();
}

const wicon=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${WI[n]}</svg>`;
function wdesc(c,day){
  if(c===0)return day?['Cerah','sun']:['Cerah','moon'];
  if(c===1)return day?['Cerah berawan','pcloud']:['Cerah berawan','moon'];
  if(c===2)return ['Berawan sebagian','pcloud'];
  if(c===3)return ['Berawan','cloud'];
  if(c<=48)return ['Berkabut','fog'];
  if(c<=57)return ['Gerimis','rain'];
  if(c<=67)return ['Hujan','rain'];
  if(c<=77)return ['Berawan','cloud'];
  if(c<=82)return ['Hujan lebat','rain'];
  if(c>=95)return ['Badai petir','storm'];
  return ['Berawan','cloud']}

async function fetchJ(url,ms=9000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);

const getPos=()=>new Promise(res=>{const fb={lat:-6.2088,lon:106.8456,approx:true};

/* ---- jadwal shalat (hitung lokal, standar Kemenag RI: Subuh 20°, Isya 18°, Ashar mazhab Syafi'i, ihtiyath +2 menit) ---- */
function prayerTimes(date,lat,lon,tz){
  const R=Math.PI/180,sin=x=>Math.sin(x*R),cos=x=>Math.cos(x*R),fix=(x,a)=>x-a*Math.floor(x/a);
  const D=Date.UTC(date.getFullYear(),date.getMonth(),date.getDate(),12)/864e5+2440587.5-2451545;
  const g=fix(357.529+0.98560028*D,360),q=fix(280.459+0.98564736*D,360),L=fix(q+1.915*sin(g)+0.02*sin(2*g),360),e=23.439-3.6e-7*D;
  const ra=fix(Math.atan2(cos(e)*sin(L),cos(L))/R,360)/15,eqt=q/15-ra,decl=Math.asin(sin(e)*sin(L))/R;
  const noon=12+tz-lon/15-eqt;
  const T=a=>{const c=(-sin(a)-sin(lat)*sin(decl))/(cos(lat)*cos(decl));return Math.acos(Math.max(-1,Math.min(1,c)))/R/15};
  const A=Math.atan(1/(1+Math.tan(Math.abs(lat-decl)*R)))/R,asr=Math.acos((sin(A)-sin(lat)*sin(decl))/(cos(lat)*cos(decl)))/R/15;
  const ih=2/60,mk=h=>{const x=fix(h+ih,24),d=new Date(date);d.setHours(Math.floor(x),Math.round((x%1)*60),0,0);return d};
  return [['Subuh',mk(noon-T(20))],['Dzuhur',mk(noon)],['Ashar',mk(noon+asr)],['Maghrib',mk(noon+T(0.833))],['Isya',mk(noon+T(18))]]}
function renderPrayer(){
  const box=$('#pry');if(!box)return;const wx=jget(WX_KEY)||{},lat=wx.lat!=null?wx.lat:-6.2088,lon=wx.lon!=null?wx.lon:106.8456,now=new Date(),tz=-now.getTimezoneOffset()/60;
  const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
  let list=prayerTimes(now,lat,lon,tz),nx=list.findIndex(x=>x[1]>now),tom=false,nxt;
  if(nx<0){const t=new Date(now);t.setDate(t.getDate()+1);nxt=prayerTimes(t,lat,lon,tz)[0];tom=true}else nxt=list[nx];
  const mins=Math.max(0,Math.round((nxt[1]-now)/6e4)),cd=(mins>=60?Math.floor(mins/60)+' j ':'')+(mins%60)+' mnt';
  box.innerHTML=`<div class="nx"><small>Shalat berikutnya</small><b>${nxt[0]} ${hm(nxt[1])}</b><span>${cd} lagi${tom?' (besok)':''}</span></div>`+list.map((x,i)=>`<div class="pl ${!tom&&i===nx?'on':''}"><span>${x[0]}</span><span>${hm(x[1])}</span></div>`).join('')+`<div class="loc">${wx.city&&!wx.approx?esc(wx.city):'Jakarta (default)'}</div>`}
function renderLock(){renderCal();renderNC();renderPrayer()}
document.addEventListener('submit',e=>{if(!e.target||e.target.id!=='lkAdd')return;e.preventDefault();
  const t=$('#lkNew').value.trim();if(!t)return;S.todos.push({id:uid(),text:t,done:false});touch();renderNC();const n=$('#lkNew');if(n)n.focus()});

let clockT=null,lockT=null;
function showLock(){$('#lock').hidden=false;$('#app').hidden=true;$('#pw').value='';$('#lockMsg').textContent='';
  tickClock();renderLock();setThemeIcon();loadWeather();loadKurs();
  clearInterval(clockT);clearInterval(lockT);clockT=setInterval(tickClock,1000);lockT=setInterval(renderLock,30000);
  setTimeout(()=>$('#pw').focus(),50)}
async function unlock(){
  $('#lock').hidden=true;$('#app').hidden=false;clearInterval(clockT);clearInterval(lockT);
  try{sessionStorage.setItem('crm_unlocked','1')}catch(e){}
  render();loadKurs();if(cfg.url&&!unlock.done){unlock.done=true;await pullSheet(true);render()}}
$('#unlockForm').addEventListener('submit',e=>{e.preventDefault();
  if($('#pw').value===PASSWORD)unlock();
  else{const b=$('#pwBox');$('#lockMsg').textContent='Kata sandi belum tepat.';b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');$('#pw').select()}});

/* ====================== Boot ====================== */
(function boot(){
  const saved=jget(LS);
  if(saved){S=norm(saved)}
  else{S=demo();cfg.demo=true;jset(LSC,cfg);persist()}
  ensureBudget();renderSide();initClockFace();setThemeIcon();setSync(cfg.url?'saved':'local');
  let open=false;try{open=sessionStorage.getItem('crm_unlocked')==='1'}catch(e){}
  if(open)unlock();else showLock();
})();
</script>
