<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM Adit</title>
<style>
/* Layout: lockscreen kaca ala iPadOS, lalu sidebar 9 tab + area kerja yang ringan. Warna netral kebiruan, satu aksen biru. */
:root{
  --bg:#f1f3f8;--surface:#ffffff;--surface2:#f6f7fb;--fg:#1b1d24;--muted:#677084;--line:#e3e6ee;
  --accent:#2f6df6;--accent-soft:#e7eeff;--accent-fg:#ffffff;
  --good:#1b9a60;--good-soft:#e2f5ec;--warn:#c9800a;--warn-soft:#fdf0d8;--bad:#d63c4a;--bad-soft:#fde7e9;
  --track:#e6e9f1;--track2:#c9d1e3;
  --shadow:0 1px 2px rgba(20,28,50,.05),0 10px 28px rgba(20,28,50,.06);
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1015;--surface:#181b22;--surface2:#1f232c;--fg:#eceef4;--muted:#98a0b3;--line:#2a2f3a;
  --accent:#5b8cff;--accent-soft:#1c2a52;--accent-fg:#0b1020;
  --good:#38c284;--good-soft:#14301f;--warn:#e6a43a;--warn-soft:#33270f;--bad:#f0636f;--bad-soft:#3a1a1e;
  --track:#262b36;--track2:#3b4354;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ---------- Lockscreen ---------- */
#lock{position:fixed;inset:0;z-index:60;color:#fff;display:flex;flex-direction:column;align-items:center;gap:22px;padding:clamp(20px,4vh,44px) max(16px,env(safe-area-inset-right,0px)) clamp(20px,4vh,40px) max(16px,env(safe-area-inset-left,0px));overflow:auto;
  background:radial-gradient(1100px 700px at 12% 8%,#6f9bff 0,transparent 60%),radial-gradient(900px 700px at 92% 18%,#b78bff 0,transparent 55%),radial-gradient(1000px 800px at 55% 105%,#2fcbbd 0,transparent 55%),#18204a}
#lock .clock{text-align:center;margin-top:clamp(0px,2vh,18px)}
#lock .ldate{font-size:clamp(16px,2.2vw,22px);font-weight:600;opacity:.92}
#lock .ltime{font-size:clamp(72px,13vw,148px);font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 4px 30px rgba(0,0,0,.18)}
.widgets{width:100%;max-width:1120px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.glass{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);border-radius:24px;padding:16px 18px;min-width:0}
.glass h4{margin:0 0 10px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;opacity:.75;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px}
.cal b{font-weight:600;opacity:.6;font-size:10px;padding-bottom:3px}
.cal span{padding:4px 0;border-radius:50%;position:relative;font-variant-numeric:tabular-nums}
.cal span.today{background:#fff;color:#18204a;font-weight:700}
.cal span.dot::after{content:"";position:absolute;left:50%;bottom:0;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#ffd166}
.cal-title{display:flex;justify-content:space-between;font-weight:600;margin-bottom:8px}
.kurs{display:flex;flex-direction:column;gap:9px}
.kurs div{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.kurs strong{font-size:18px;font-variant-numeric:tabular-nums}
.kurs small,.glass small{opacity:.7;font-size:11px}
.quote{font-size:16px;line-height:1.4;font-weight:500}
.ltodo{display:flex;flex-direction:column;gap:7px;max-height:168px;overflow:auto}
.ltodo label{display:flex;gap:9px;align-items:flex-start;cursor:pointer}
.ltodo input{margin:3px 0 0;width:auto;flex:none;accent-color:#fff}
.ltodo .done span{text-decoration:line-through;opacity:.55}
.unlock{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:6px}
.avatar{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;font-size:24px;font-weight:700;backdrop-filter:blur(14px)}
.pw{display:flex;align-items:center;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:4px 4px 4px 18px;width:min(320px,86vw);backdrop-filter:blur(18px)}
.pw input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;padding:9px 0;font-size:15px}
.pw input::placeholder{color:rgba(255,255,255,.7)}
.pw button{width:38px;height:38px;border-radius:50%;border:0;background:#fff;color:#18204a;cursor:pointer;font-size:18px;font-weight:700}
.pw:focus-within{box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#lockMsg{min-height:18px;font-size:12px;opacity:.9}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}

/* ---------- App shell ---------- */
.shell{display:grid;grid-template-columns:228px minmax(0,1fr);height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 16px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700}
.nav{display:flex;align-items:center;gap:11px;border:0;background:none;text-align:left;padding:9px 10px;border-radius:11px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.nav svg{width:19px;height:19px;flex:none}
.nav:hover{background:var(--surface2);color:var(--fg)}
.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
svg.ic{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.main{overflow:auto;min-width:0;padding:0 max(18px,env(safe-area-inset-right,0px)) 48px max(18px,env(safe-area-inset-left,0px))}
.inner{max-width:1240px;margin:0 auto}
.top{position:sticky;top:0;z-index:8;background:var(--bg);display:flex;align-items:center;gap:10px;padding:16px 0 14px;flex-wrap:wrap}
.top h1{font-size:22px;letter-spacing:-.02em;flex:1;min-width:140px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--muted)}
.chip svg{width:15px;height:15px}
.chip .d{width:8px;height:8px;border-radius:50%;background:var(--track2)}
.chip.saved .d{background:var(--good)}.chip.dirty .d,.chip.saving .d{background:var(--warn)}.chip.error .d{background:var(--bad)}
.icon-btn{position:relative;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--muted);font-size:18px;line-height:1}
.icon-btn svg{width:18px;height:18px}
.icon-btn:hover{color:var(--fg)}
.badge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;font-size:13px}

/* ---------- Components ---------- */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h3{font-size:15px;letter-spacing:-.01em}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:550;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.link{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-weight:600}
.link:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea{resize:vertical;min-height:84px;max-height:220px;overflow:auto}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar>*{width:auto;flex:0 1 auto}
.bar input[type=search]{flex:1 1 220px;min-width:160px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.big.sm{font-size:22px}
.lbl{font-size:12px;color:var(--muted);font-weight:550}
.stat{display:flex;flex-direction:column;gap:5px}
.stat .link{align-self:flex-start;margin-top:4px}
.tbl-wrap{overflow-x:auto;border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;background:var(--surface);position:sticky;top:0;z-index:2;box-shadow:inset 0 -1px 0 var(--line)}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--fg)}
th.sortable::after{content:" ↕";opacity:.35}
th.sortable.on.asc::after{content:" ↑";opacity:1;color:var(--accent)}
th.sortable.on.desc::after{content:" ↓";opacity:1;color:var(--accent)}
td.r,th.r{text-align:right}
td.r{white-space:nowrap}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:650;border-top:1px solid var(--line);border-bottom:0}
.acts{white-space:nowrap;text-align:right}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
.clamp{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;max-width:340px}
.seg{display:inline-flex;background:var(--surface2);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* dashboard */
.pie-row{display:flex;gap:18px;align-items:center}
.pie-row svg{width:104px;height:104px;flex:none}
.pie-row>div{min-width:0}
.hl{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.notif{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.notif:last-child{border-bottom:0}
.sev{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}
.sev.bad{background:var(--bad)}.sev.warn{background:var(--warn)}

/* chart */
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line)}
.chart .ax{fill:var(--muted);font-size:11px}
.chart .bar-t{fill:var(--track2)}
.chart .bar-a{fill:var(--accent)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* kanban */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{flex:0 0 264px;background:var(--surface2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;max-height:540px}
.col.now{outline:2px solid var(--accent);outline-offset:-2px}
.col-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px}
.col-h b{font-size:13px}
.col-h button.t{border:0;background:none;font-weight:700;cursor:pointer;display:flex;gap:7px;align-items:center;padding:0}
.col-h .dot{width:9px;height:9px;border-radius:50%}
.col-body{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:20px}
.kc{background:var(--surface);border-radius:11px;padding:10px 11px;box-shadow:0 1px 2px rgba(20,28,50,.06);display:flex;flex-direction:column;gap:5px;min-width:0}
.kc .t{font-weight:650}
.kc .s{color:var(--muted);font-size:12px}
.kc .n{font-size:12px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.kc.click{cursor:pointer}
.kc.click:hover{box-shadow:0 0 0 1.5px var(--accent)}
.kc .tools{display:flex;gap:4px;justify-content:space-between;align-items:center;margin-top:2px}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:2px 9px;cursor:pointer;font-size:12px}
.mini:disabled{opacity:.35;cursor:default}
.mini:hover:not(:disabled){background:var(--surface2)}
.week-sub{font-size:11px;color:var(--muted);padding:0 4px}
.addb{border:1.5px dashed var(--track2);background:none;border-radius:10px;padding:7px;cursor:pointer;color:var(--muted);font-weight:600}
.addb:hover{color:var(--accent);border-color:var(--accent)}

/* products split */
.split{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:14px;align-items:start}
.pcard{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pcard.on{border-color:var(--accent);background:var(--accent-soft)}
.pcard b{display:block}
.pcard small{color:var(--muted)}
.plist{display:flex;flex-direction:column;gap:8px;max-height:388px;overflow:auto}
.split .tbl-wrap{max-height:460px}
.pcard{min-height:90px}

/* calculator */
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.xrow{display:grid;grid-template-columns:1fr 150px auto;gap:8px;margin-bottom:8px;align-items:center}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,28,.45);z-index:70;backdrop-filter:blur(3px)}
.sheet{position:fixed;z-index:71;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 28px);background:var(--surface);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden}
.sheet.wide{width:min(720px,calc(100vw - 24px))}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.sheet-h h3{font-size:16px}
.sheet-b{padding:16px 20px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet-f{display:flex;gap:8px;justify-content:flex-end;padding-top:4px;flex-wrap:wrap}
.sheet-f .left{margin-right:auto}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:12px;color:var(--muted);font-weight:600}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.contact{display:grid;grid-template-columns:1fr 1fr 1.2fr auto;gap:6px;margin-bottom:6px}
.sum-line{background:var(--surface2);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;font-weight:650}
.tdl{display:flex;flex-direction:column;gap:2px;max-height:300px;overflow:auto}
.tdl .it{display:flex;gap:10px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line)}
.tdl .it input{width:auto;accent-color:var(--accent)}
.tdl .it span{flex:1;min-width:0}
.tdl .it.done span{text-decoration:line-through;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:90;font-weight:550;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}

.btn.icon,.mini.icon{display:inline-grid;place-items:center;padding:0;width:32px;height:32px;border-radius:9px}
.mini.icon{width:28px;height:28px;border-radius:8px}
.btn.icon svg,.mini.icon svg{width:16px;height:16px}
.acts .btn{margin-left:4px}
.mini.danger{color:var(--bad)}
.cblock{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;display:flex;flex-direction:column;gap:8px}
.crow1{display:grid;grid-template-columns:1.2fr 1fr 1.2fr auto;gap:6px}
.phone-row{display:flex;gap:6px;margin-bottom:6px}
.phone-row:last-child{margin-bottom:0}
.col.wk{flex:0 0 248px;width:248px;min-width:248px;max-width:248px;max-height:none}
.col.wk .col-body{max-height:268px}
.col.wk .kc{height:84px;flex:none;overflow:hidden}
.kc .n2{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.col.st{max-height:none}
.col.st .col-body{max-height:442px}
.kc.pc{height:142px;flex:none;overflow:hidden}
.kc.pc .t,.kc.pc .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nxlist{max-height:180px;overflow:auto}
.plan-wrap{max-height:262px}
.chart .hit{fill:transparent}
.chart .hit:hover{fill:var(--accent-soft)}
.chart .bar-t,.chart .bar-a{pointer-events:none}
#tip{position:fixed;z-index:95;pointer-events:none;background:var(--fg);color:var(--bg);padding:8px 11px;border-radius:10px;font-size:12px;line-height:1.5;box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
@media (min-width:601px){
 .main.fit{padding-bottom:20px}
 .main.fit .inner{height:100%;display:flex;flex-direction:column}
 .main.fit #banner{flex:none}
 .main.fit #view{flex:1;min-height:0}
 .fit-page{height:100%;min-height:300px;display:flex;flex-direction:column;gap:22px}
 .fit-page>.grid{gap:16px}
 .fit-page>*{flex:none}
 .fit-page>.grow{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
 .grow>.card-h,.grow>.bar{flex:none}
 .grow>.tbl-wrap{flex:1;min-height:90px;overflow:auto}
 .main.fit .split{height:100%;min-height:300px;align-items:stretch;gap:22px}
 .main.fit .split>*{min-height:0}
 .main.fit .card.pl{display:flex;flex-direction:column;height:100%}
 .main.fit .card.pl>*{flex:none}
 .main.fit .split{min-height:0;overflow:hidden;align-items:start}
 .main.fit .split>div:last-child{height:100%;min-height:0;overflow:auto}
 .main.fit .split .fit-page{min-height:0}
 .main.fit .card.pl{height:auto;max-height:100%}
 .main.fit .plist{flex:1;min-height:0;max-height:388px}
 .main.fit .split .grow>.tbl-wrap{min-height:150px;max-height:none}
}
@media (min-width:601px) and (max-width:900px){.main.fit .split{grid-template-columns:1fr;grid-template-rows:minmax(170px,36%) minmax(0,1fr)}}
@media (min-width:601px) and (max-height:700px){.fit-page .card.stat{padding:12px 16px;gap:2px}.fit-page .big.sm{font-size:19px}.fit-page .big{font-size:24px}.fit-page{gap:14px}.main.fit .top{padding:10px 0 8px}.main.fit .banner{padding:6px 12px;margin-bottom:8px}.main.fit .card.grow{padding:14px}}
@media (max-width:560px){.crow1{grid-template-columns:1fr 1fr}}
@media (max-width:900px){
  .shell{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}

<script>
'use strict';
/* ====================== Util ====================== */
const LS='crm_adit_data_v1', LSC='crm_adit_cfg_v1', PASSWORD='Aditya';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const MONF=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const DAYF=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const FYM=['Jul','Agu','Sep','Okt','Nov','Des','Jan','Feb','Mar','Apr','Mei','Jun'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const N=v=>{const x=Number(v);return isFinite(x)?x:0};
const rp=n=>'Rp '+Math.round(N(n)).toLocaleString('id-ID');
const nf=(n,d=0)=>N(n).toLocaleString('id-ID',{maximumFractionDigits:d});
const sum=a=>a.reduce((x,y)=>x+N(y),0);
const parseD=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const fdate=s=>{const d=parseD(s);return d?d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear():'—'};
const dm=d=>d.getDate()+' '+MON[d.getMonth()];
const daysTo=s=>{const d=parseD(s);if(!d)return null;const t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/864e5)};
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const jget=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const jset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const compact=n=>{n=N(n);return n>=1e9?nf(n/1e9,1)+' M':n>=1e6?nf(n/1e6,1)+' jt':n>=1e3?nf(n/1e3,0)+' rb':String(n)};
const lastLine=t=>{const l=String(t||'').split('\n').map(x=>x.trim()).filter(Boolean);return l.length?l[l.length-1]:''};

/* fiscal year: week 1 starts 1 July */
const FY=(d=>d.getMonth()>=6?d.getFullYear():d.getFullYear()-1)(new Date());
function weekMon(n){const j=new Date(FY,6,1),w=j.getDay();const m=new Date(j);
  if(w===0)m.setDate(j.getDate()+1);else if(w===6)m.setDate(j.getDate()+2);else m.setDate(j.getDate()-(w-1));
  m.setDate(m.getDate()+7*(n-1));return m}
function weekRange(n){const mon=weekMon(n),fri=new Date(mon);fri.setDate(mon.getDate()+4);let s=mon;
  if(n===1){const j=new Date(FY,6,1);if(j>mon&&j.getDay()!==0&&j.getDay()!==6)s=j}return [s,fri]}
function curWeek(){const t=new Date();t.setHours(0,0,0,0);return Math.min(52,Math.max(1,Math.floor((t-weekMon(1))/(7*864e5))+1))}
const curMonthIdx=()=>(new Date().getMonth()+6)%12;
const CW=curWeek();

const IDK=/(^id$|Id$)/;
function norm(d){const o=blank();
  KEYS.forEach(k=>{const a=Array.isArray(d&&d[k])?d[k]:[];o[k]=a.map(r=>{r=Object.assign({},r);
    Object.keys(r).forEach(f=>{if(IDK.test(f))r[f]=String(r[f]);if(r[f]===null||r[f]===undefined)r[f]=''});
    return r})});
  o.customers.forEach(c=>{c.entity=c.entity||'';c.creditLimit=N(c.creditLimit);c.tempo=N(c.tempo);if(!Array.isArray(c.contacts))c.contacts=[];c.contacts=c.contacts.map(k=>{k=Object.assign({role:''},k);if(!Array.isArray(k.phones))k.phones=k.phone?[String(k.phone)]:[];delete k.phone;return k})});
  o.products.forEach(p=>{p.cogs=N(p.cogs);p.principal=p.principal||''});
  o.pos.forEach(p=>{p.qty=N(p.qty);p.price=N(p.price)});
  o.activities.forEach(a=>{a.week=N(a.week);a.fy=N(a.fy)});
  o.pipeline.forEach(p=>{p.qty=N(p.qty);p.value=N(p.value);p.price=(p.price===''||p.price===undefined)?(p.qty>0?Math.round(p.value/p.qty):''):N(p.price)});
  o.outstanding.forEach(p=>{p.qty=N(p.qty);p.price=N(p.price)});
  o.overdue.forEach(p=>p.amount=N(p.amount));
  o.todos.forEach(t=>t.done=(t.done===true||t.done==='TRUE'||t.done==='true'));
  o.budget.forEach(b=>{b.m=N(b.m);b.target=N(b.target);b.ach=N(b.ach)});
  return o}
function persist(){jset(LS,S)}

function ensureBudget(){['value','margin'].forEach(mt=>{for(let i=0;i<12;i++)if(!S.budget.find(b=>b.metric===mt&&b.m===i))S.budget.push({id:mt+'-'+i,metric:mt,m:i,target:0,ach:0})})}
function budgetOf(mt){const t=Array(12).fill(0),a=Array(12).fill(0);S.budget.filter(b=>b.metric===mt).forEach(b=>{t[b.m]=N(b.target);a[b.m]=N(b.ach)});return {t,a}}

/* ====================== Sync (Google Sheet) ====================== */
let tmr=null,syncState='local',lastErr='';
function setSync(s){syncState=s;const el=$('#syncChip');if(!el)return;
  const label={local:'Hanya di perangkat ini',saved:'Tersimpan di Google Sheet',dirty:'Belum disimpan',saving:'Menyimpan…',error:'Gagal sinkron'}[s];
  el.className='chip '+s;el.innerHTML='<span class="d"></span>'+svg('sheet')+' '+label}
function touch(){persist();if(cfg.url){setSync('dirty');clearTimeout(tmr);tmr=setTimeout(pushSheet,1600)}else setSync('local')}
function explainErr(e,res){
  const m=String(e&&e.message||e);
  if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(cfg.url))return 'URL belum benar. Harus diawali https://script.google.com/macros/s/ dan diakhiri /exec';
  if(e&&e.name==='SyntaxError')return 'Google membalas halaman login. Di Deploy, set "Who has access" ke Anyone, lalu buat deployment baru.';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return 'Browser tidak bisa menjangkau skrip. Cek akses deployment = Anyone, dan buka aplikasi sebagai file di browser (bukan lewat pratinjau di chat).';
  return 'Skrip membalas: '+m}
async function pushSheet(manual){
  if(!cfg.url){if(manual)toast('Hubungkan Google Sheet dulu lewat tombol di kanan atas');return false}
  clearTimeout(tmr);setSync('saving');
  try{const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'save',data:S})});
    const j=await r.json();if(!j.ok)throw new Error(j.error||'gagal');setSync('saved');if(manual)toast('Tersimpan ke Google Sheet');return true}
  catch(e){setSync('error');lastErr=explainErr(e);toast('Gagal menyimpan: '+lastErr);return false}}
async function pullSheet(silent){
  if(!cfg.url)return false;setSync('saving');
  try{const r=await fetch(cfg.url+(cfg.url.includes('?')?'&':'?')+'action=load');const j=await r.json();if(!j.ok)throw new Error(j.error||'gagal');
    const d=norm(j.data);const has=KEYS.some(k=>k!=='budget'&&d[k].length)||d.budget.length;
    if(has){S=d;ensureBudget();cfg.demo=false;jset(LSC,cfg);persist()}
    setSync('saved');if(!silent)toast(has?'Data dimuat dari Google Sheet':'Sheet masih kosong, data lokal dipakai');return true}
  catch(e){setSync('error');lastErr=explainErr(e);if(!silent)toast('Gagal terhubung: '+lastErr);return false}}
function saveNow(){return pushSheet(true)}

const fld=(label,html,cls='')=>`<label class="fld ${cls}"><span>${label}</span>${html}</label>`;
const inp=(name,val='',attrs='')=>`<input name="${name}" value="${esc(val)}" ${attrs}>`;
const empty=t=>`<div class="empty">${t}</div>`;
const amt=r=>N(r.qty)*N(r.price);
function sortBy(rows,st,get){const f=st.dir==='asc'?1:-1;return rows.slice().sort((a,b)=>{const x=get[st.k](a),y=get[st.k](b);if(typeof x==='number'&&typeof y==='number')return (x-y)*f;return String(x).localeCompare(String(y),'id')*f})}
const th=(p,k,l,cls='')=>{const s=UI[p].sort;return `<th class="sortable ${cls} ${s.k===k?'on '+s.dir:''}" data-act="sort" data-p="${p}" data-k="${k}">${l}</th>`};
const filterSel=(path,label,opts,val)=>`<select data-bind="${path}" id="f-${path.replace('.','-')}" aria-label="${label}"><option value="">${label}</option>${opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(v)===String(val)?'selected':''}>${esc(l)}</option>`}).join('')}</select>`;
const rowTools=(t,id)=>`<td class="acts"><button class="btn icon" data-act="edit" data-t="${t}" data-id="${id}" aria-label="Edit" title="Edit">${svg('edit')}</button><button class="btn icon danger" data-act="del" data-t="${t}" data-id="${id}" aria-label="Hapus" title="Hapus">${svg('trash')}</button></td>`;
const miniTools=(t,id)=>`<button class="mini icon" data-act="edit" data-t="${t}" data-id="${id}" aria-label="Edit" title="Edit">${svg('edit')}</button><button class="mini icon danger" data-act="del" data-t="${t}" data-id="${id}" aria-label="Hapus" title="Hapus">${svg('trash')}</button>`;
const custCell=id=>{const c=S.customers.find(x=>x.id===id);return c?`<b>${esc(c.name)}</b>${c.entity?` <span class="pill">${esc(c.entity)}</span>`:''}`:'<span class="muted">(customer dihapus)</span>'};
const brief=(t,n=80)=>{const x=String(t||'').replace(/\s+/g,' ').trim();return x.length>n?x.slice(0,n).trimEnd()+'…':x};
const ROLES=['R&D','Purchasing','Finance','Director/Owner'];
let BUD=null;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2800)}

/* ====================== Modal ====================== */
function closeModal(){$('#modal-root').innerHTML=''}
function modal(title,body,o={}){
  const root=$('#modal-root');
  root.innerHTML=`<div class="scrim" data-act="closeModal"></div><div class="sheet ${o.wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-h"><h3>${esc(title)}</h3><button class="icon-btn" data-act="closeModal" aria-label="Tutup" type="button">×</button></div><form id="mform" class="sheet-b" autocomplete="off">${body}<div class="sheet-f">${o.onDelete?'<button type="button" class="btn danger left" id="mdel">Hapus</button>':''}${o.foot===undefined?`<button type="button" class="btn" data-act="closeModal">Batal</button><button class="btn primary">${o.submit||'Simpan'}</button>`:o.foot}</div></form></div>`;
  const f=$('#mform');applyIf(f);
  f.addEventListener('change',()=>applyIf(f));
  f.addEventListener('submit',e=>{e.preventDefault();if(o.onSubmit&&o.onSubmit(new FormData(f),f)===false)return;closeModal()});
  if(o.onDelete)$('#mdel').onclick=()=>{closeModal();o.onDelete()};
  if(o.onMount)o.onMount(f);
  const first=$('input:not([type=hidden]),select,textarea',f);if(first&&!o.noFocus)first.focus();
}
function applyIf(f){$$('[data-if]',f).forEach(el=>{const [n,v]=el.dataset.if.split('=');const c=f.elements[n];el.hidden=!(c&&c.value===v)})}
function ask(msg,fn,btn='Hapus'){modal('Konfirmasi',`<p>${msg}</p>`,{submit:btn,onSubmit:()=>{fn()},noFocus:true})}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ====================== Pages ====================== */
function pie(pct,col){const p=Math.max(0,Math.min(100,pct));
  if(p>=99.99)return `<svg viewBox="-60 -60 120 120" role="img" aria-label="${pct.toFixed(0)} persen"><circle r="56" fill="${col}"/></svg>`;
  const a=p/100*2*Math.PI,x=56*Math.sin(a),y=-56*Math.cos(a);
  return `<svg viewBox="-60 -60 120 120" role="img" aria-label="${pct.toFixed(0)} persen"><circle r="56" fill="var(--track)"/>${p>0?`<path d="M0 0 L0 -56 A56 56 0 ${p>50?1:0} 1 ${x.toFixed(2)} ${y.toFixed(2)} Z" fill="${col}" stroke="var(--surface)" stroke-width="2"/>`:''}</svg>`}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function bars(t,a){BUD={t,a};const W=760,H=250,L=56,B=28,T=12,R=8;const max=niceMax(Math.max(...t,...a,1));const cw=(W-L-R)/12,bw=Math.min(18,cw/2.6);
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Budget dan achievement bulanan">`;
  for(let i=0;i<=4;i++){const y=T+(H-T-B)*(1-i/4);s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="ax" x="${L-8}" y="${y+4}" text-anchor="end">${compact(max*i/4)}</text>`}
  for(let i=0;i<12;i++){const cx=L+cw*i+cw/2,ht=(H-T-B)*t[i]/max,ha=(H-T-B)*a[i]/max;
    s+=`<rect class="hit" data-i="${i}" x="${(L+cw*i).toFixed(1)}" y="${T}" width="${cw.toFixed(1)}" height="${H-T-B}"/><rect class="bar-t" x="${(cx-bw-1).toFixed(1)}" y="${(H-B-ht).toFixed(1)}" width="${bw}" height="${ht.toFixed(1)}" rx="3"/><rect class="bar-a" x="${(cx+1).toFixed(1)}" y="${(H-B-ha).toFixed(1)}" width="${bw}" height="${ha.toFixed(1)}" rx="3"/><text class="ax" x="${cx.toFixed(1)}" y="${H-8}" text-anchor="middle">${FYM[i]}</text>`}
  return s+'</svg>'}

function notifs(){const L=[];
  S.overdue.forEach(o=>{const d=daysTo(o.due);if(d!==null&&d<=0)L.push({sev:'bad',d,page:'over',text:`Invoice ${esc(o.invoice)} (${esc(cn(o.customerId))}) ${d===0?'jatuh tempo hari ini':'lewat '+(-d)+' hari'} · ${rp(o.amount)}`})});
  S.samples.forEach(s=>{if(s.status!=='trial')return;const d=daysTo(s.due);if(d!==null&&d<=0)L.push({sev:d<0?'bad':'warn',d,page:'samp',text:`Sample ${esc(s.name)} (${esc(cn(s.customerId))}) ${d===0?'jatuh tempo hari ini':'lewat '+(-d)+' hari'}`})});
  S.pipeline.forEach(p=>{if(p.status==='win'||p.status==='lost')return;const d=daysTo(p.closing);if(d!==null&&d<=3)L.push({sev:d<0?'bad':'warn',d,page:'pipe',text:`Target closing ${esc(cn(p.customerId))} · ${esc(p.product)} ${d<0?'lewat '+(-d)+' hari':d===0?'hari ini':'H-'+d}`})});
  return L.sort((a,b)=>a.d-b.d)}

function pageDash(){
  const cm=curMonthIdx();
  const pieCard=(title,mt,col)=>{const b=budgetOf(mt),T=sum(b.t),A=sum(b.a),pct=T?A/T*100:0,exp=sum(b.t.slice(0,cm+1)),on=A>=exp&&T>0;
    return `<div class="card stat"><div class="card-h" style="margin-bottom:4px"><h3>${title}</h3><span class="pill ${on?'good':'warn'}">${on?'On track':'Keep working'}</span></div>
    <div class="pie-row">${pie(pct,col)}<div><div class="big">${pct.toFixed(1)}%</div><div class="muted num">${rp(A)}<br>dari ${rp(T)}</div></div></div>
    <button class="link" data-act="openBudget" data-m="${mt}">Lihat detail →</button></div>`};
  const cnt=k=>S.pipeline.filter(p=>p.status===k).length;
  const pipeCard=(k,l)=>`<div class="stat"><span class="lbl">${l}</span><span class="big">${cnt(k)}</span></div>`;
  const weekActs=S.activities.filter(a=>a.fy===FY&&a.week===CW).length,fyActs=S.activities.filter(a=>a.fy===FY).length;
  const openTodo=S.todos.filter(t=>!t.done).length;
  const nt=notifs();
  return `<div class="stack">
   ${nt.length?`<div class="card"><div class="card-h"><h3>Perlu perhatian</h3><span class="pill bad">${nt.length}</span></div>${nt.slice(0,5).map(n=>`<div class="notif"><span class="sev ${n.sev}"></span><div style="flex:1;min-width:0">${n.text}</div><button class="link" data-act="go" data-page="${n.page}">Buka</button></div>`).join('')}${nt.length>5?`<div class="muted" style="padding-top:8px">dan ${nt.length-5} lainnya di ikon notifikasi</div>`:''}</div>`:''}
   <div class="grid g2">${pieCard('Achievement sales value','value','var(--accent)')}${pieCard('Achievement sales margin','margin','var(--good)')}</div>
   <div class="card"><div class="card-h"><h3>Highlight pipeline</h3><button class="link" data-act="go" data-page="pipe">Lihat detail →</button></div>
     <div class="grid g4">${pipeCard('lead','Lead')}${pipeCard('sample','Sample/Trial')}${pipeCard('quotation','Quotation')}${pipeCard('win','Win')}</div></div>
   <div class="grid g4">
     <div class="card stat"><span class="lbl">Activity report minggu ini</span><span class="big">${weekActs}</span><span class="muted">${fyActs} aktivitas di FY ${FY}/${String(FY+1).slice(2)}</span><button class="link" data-act="go" data-page="act">Lihat detail →</button></div>
     <div class="card stat"><span class="lbl">Outstanding sales</span><span class="big sm">${rp(sum(S.outstanding.map(amt)))}</span><span class="muted">${new Set(S.outstanding.map(o=>o.po)).size} PO</span><button class="link" data-act="go" data-page="out">Lihat detail →</button></div>
     <div class="card stat"><span class="lbl">Overdue customer</span><span class="big sm">${rp(sum(S.overdue.map(o=>o.amount)))}</span><span class="muted">${new Set(S.overdue.map(o=>o.customerId)).size} customer</span><button class="link" data-act="go" data-page="over">Lihat detail →</button></div>
     <div class="card stat"><span class="lbl">To do list</span><span class="big">${openTodo}</span><span class="muted">belum selesai dari ${S.todos.length}</span><button class="link" data-act="todo">Buka checklist →</button></div>
   </div></div>`}

/* ----- Customers ----- */
function pageCust(){
  const u=UI.cust,ex=S.customers.filter(c=>c.status==='existing').length,pr=S.customers.filter(c=>c.status==='prospecting').length;
  let rows=S.customers.filter(c=>{const q=u.q.toLowerCase();
    if(q&&!(fullName(c).toLowerCase().includes(q)||String(c.products).toLowerCase().includes(q)))return false;
    if(u.status&&c.status!==u.status)return false;if(u.seg&&c.segment!==u.seg)return false;
    if(u.fin&&(c.status!=='existing'||c.finansial!==u.fin))return false;return true});
  rows.sort(u.sort==='upd'?(a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt)):(a,b)=>a.name.localeCompare(b.name,'id'));
  return `<div class="fit-page">
   <div class="grid g2"><div class="card stat"><span class="lbl">Customer existing</span><span class="big">${ex}</span></div><div class="card stat"><span class="lbl">Customer prospecting</span><span class="big">${pr}</span></div></div>
   <div class="card grow"><div class="card-h"><h3>Data customer</h3><div class="row"><button class="btn" data-act="saveNow">Simpan</button><button class="btn primary" data-act="add" data-t="cust">+ Tambah customer</button></div></div>

     ${filterSel('cust.seg','Semua segmen',SEGMENTS,u.seg)}

     <select data-bind="cust.sort" id="cs" aria-label="Urutkan"><option value="az" ${u.sort==='az'?'selected':''}>Urut A–Z</option><option value="upd" ${u.sort==='upd'?'selected':''}>Terakhir diupdate</option></select></div>

    ${rows.map(c=>`<tr><td>${custCell(c.id)}<div class="muted">${esc(c.segment)}</div></td><td><span class="pill ${c.status==='existing'?'acc':''}">${c.status==='existing'?'Existing':'Prospecting'}</span></td>
     <td><div class="clamp">${esc(lastLine(c.updates))||'<span class="muted">—</span>'}</div><div class="muted">${c.updatedAt?fdate(c.updatedAt):''}</div></td>
     <td>${c.status==='existing'?`<span class="pill ${c.finansial==='overdue'?'bad':'good'}">${c.finansial==='overdue'?'Overdue':'No overdue'}</span>`:'<span class="muted">—</span>'}</td>${rowTools('cust',c.id)}</tr>`).join('')}
    </tbody></table>${rows.length?'':empty('Belum ada customer yang cocok.')}</div></div></div>`}
const phoneRow=(v='')=>`<div class="phone-row"><input class="c-phone" type="tel" placeholder="No. telepon" value="${esc(v)}" aria-label="No. telepon"><button type="button" class="btn icon" data-act="rmPhone" aria-label="Hapus nomor" title="Hapus nomor">${svg('trash')}</button></div>`;

/* ----- Products ----- */
const pStats=pid=>{const r=S.pos.filter(p=>p.productId===pid);return {qty:sum(r.map(x=>x.qty)),val:sum(r.map(amt))}};
function pageProd(){
  const u=UI.prod;let list=S.products.filter(p=>{const q=u.q.toLowerCase();return p.name.toLowerCase().includes(q)||String(p.principal||'').toLowerCase().includes(q)}).map(p=>Object.assign({},p,{st:pStats(p.id)}));
  list.sort(u.sort==='value'?(a,b)=>b.st.val-a.st.val:u.sort==='qty'?(a,b)=>b.st.qty-a.st.qty:(a,b)=>a.name.localeCompare(b.name,'id'));
  if(!S.products.find(p=>p.id===u.sel))u.sel=list.length?list[0].id:null;
  return `<div class="split"><div class="card pl"><div class="card-h"><h3>Produk</h3><button class="btn primary sm" data-act="add" data-t="prod">+ Tambah produk</button></div>
    <div class="stack" style="gap:10px;margin-bottom:12px"><input type="search" id="pq" data-bind="prod.q" value="${esc(u.q)}" placeholder="Cari nama produk atau principal" aria-label="Cari produk">
    <select data-bind="prod.sort" id="ps" aria-label="Urutkan"><option value="name" ${u.sort==='name'?'selected':''}>Urut nama produk</option><option value="value" ${u.sort==='value'?'selected':''}>Total value tertinggi</option><option value="qty" ${u.sort==='qty'?'selected':''}>Total qty tertinggi</option></select></div>
    <div class="plist">${list.map(p=>`<div class="pcard ${p.id===u.sel?'on':''}" data-act="selProd" data-id="${p.id}" tabindex="0" role="button"><div style="min-width:0"><b>${esc(p.name)}</b>${p.principal?`<small style="display:block">${esc(p.principal)}</small>`:''}<small>${rp(p.st.val)} · ${nf(p.st.qty)} kg</small></div><div class="row" style="gap:4px;flex:none;flex-wrap:nowrap">${miniTools('prod',p.id)}</div></div>`).join('')||empty('Belum ada produk.')}</div></div>
   <div>${u.sel?prodDetail(u.sel):`<div class="card">${empty('Pilih atau tambahkan produk untuk melihat detail.')}</div>`}</div></div>`}
function prodDetail(pid){
  const p=S.products.find(x=>x.id===pid),all=S.pos.filter(x=>x.productId===pid),st=pStats(pid),f=UI.po;
  const months=[...new Set(all.map(x=>String(x.date).slice(0,7)))].sort().reverse();
  let rows=all.filter(x=>(!f.cust||x.customerId===f.cust)&&(!f.month||String(x.date).slice(0,7)===f.month));
  rows=sortBy(rows,f.sort,{cust:r=>cn(r.customerId),date:r=>String(r.date),qty:r=>N(r.qty),price:r=>N(r.price),total:r=>amt(r)});

/* ----- Pipeline ----- */
function pagePipe(){
  const est=S.pipeline.filter(p=>['qualified','sample','quotation','negotiation','win'].includes(p.status));
  const nx=S.pipeline.filter(p=>!['win','lost'].includes(p.status)&&daysTo(p.closing)!==null&&daysTo(p.closing)<=3).sort((a,b)=>daysTo(a.closing)-daysTo(b.closing));
  const cd=d=>d<0?`Lewat ${-d} hari`:d===0?'Hari ini':'H-'+d;
  return `<div class="stack"><div class="card"><div class="card-h"><h3>Pipeline progress</h3><div class="row"><button class="btn" data-act="saveNow">Simpan</button><button class="btn primary" data-act="add" data-t="pipe">+ Tambah pipeline</button></div></div>
   <div class="kanban" data-keepscroll="pipe">${STAGES.map((s,i)=>{const it=S.pipeline.filter(p=>p.status===s.k);
    return `<div class="col st"><div class="col-h"><button class="t" data-act="stageInfo" data-k="${s.k}"><span class="dot" style="background:${s.c}"></span>${s.l}</button><span class="pill">${it.length}</span></div><div class="week-sub">${s.p}% · ${compact(sum(it.map(p=>p.value)))}</div>
    <div class="col-body">${it.map(p=>`<div class="kc pc"><span class="t" title="${esc(cn(p.customerId))}">${esc(cn(p.customerId))}</span><span class="s" title="${esc(p.product)}">${esc(p.product)}</span><span class="t num" style="font-size:13px">${rp(p.value)}</span><span class="n">${p.closing?'Closing '+fdate(p.closing):'&nbsp;'}</span>
     <div class="tools"><div class="row" style="gap:4px"><button class="mini" data-act="mv" data-id="${p.id}" data-d="-1" ${i===0?'disabled':''} aria-label="Geser kiri">◀</button><button class="mini" data-act="mv" data-id="${p.id}" data-d="1" ${i===STAGES.length-1?'disabled':''} aria-label="Geser kanan">▶</button></div><div class="row" style="gap:4px;flex-wrap:nowrap">${miniTools('pipe',p.id)}</div></div></div>`).join('')}</div></div>`}).join('')}</div></div>
   <div class="grid g2"><div class="card stat"><span class="lbl">Total estimated potential sales value (Qualified – Win)</span><span class="big">${rp(sum(est.map(p=>p.value)))}</span><span class="muted">${est.length} peluang · tertimbang probability ${rp(sum(est.map(p=>p.value*STG[p.status].p/100)))}</span></div>
   <div class="card"><div class="card-h"><h3>Next action (H-3 target closing)</h3></div><div class="nxlist">${nx.map(p=>{const d=daysTo(p.closing);return `<div class="notif"><span class="sev ${d<0?'bad':'warn'}"></span><div style="flex:1;min-width:0"><b>${esc(cn(p.customerId))}</b> · ${esc(p.product)}<div class="muted">${esc(p.next)||'Belum ada next action'}</div></div><span class="pill ${d<0?'bad':'warn'}">${cd(d)}</span></div>`}).join('')||empty('Belum ada yang mendekati target closing.')}</div></div></div></div>`}

   <div class="fld" style="margin-top:12px"><span>Biaya tambahan (Rp/kg)</span>${c.extras.map((x,i)=>`<div class="xrow"><input id="xn${i}" data-calc="xn:${i}" value="${esc(x.n)}" aria-label="Nama biaya"><input type="number" min="0" step="any" id="xv${i}" data-calc="xv:${i}" value="${esc(x.v)}" placeholder="0" aria-label="Nilai biaya"><button class="btn sm" data-act="rmExtra" data-i="${i}" aria-label="Hapus biaya">×</button></div>`).join('')}
   <button class="btn sm" data-act="addExtra" style="align-self:flex-start">+ Tambah biaya</button></div>
   <div class="frow" style="margin-top:16px">${fld('Target margin (%)',`<input type="number" min="0" max="99.9" step="any" id="cm" data-calc="margin" value="${esc(c.margin)}" placeholder="mis. 20">`)}${fld('Target harga jual (Rp/kg)',`<input type="number" min="0" step="any" id="cp" data-calc="price" value="${esc(c.price)}" placeholder="mis. 53000">`)}</div></div>
   <div class="card"><div class="card-h"><h3>Hasil</h3></div><div id="calcOut"></div></div></div>`}
function calcUpdate(){const c=UI.calc,el=$('#calcOut');if(!el)return;
  const cost=N(c.cogs)+sum(c.extras.map(x=>x.v));let h=`<div class="stat" style="margin-bottom:14px"><span class="lbl">Total biaya</span><span class="big sm">${rp(cost)}/kg</span></div>`;
  const m=parseFloat(c.margin),p=parseFloat(c.price);
  if(isFinite(m)&&m>=0&&m<100&&cost>0){const price=cost/(1-m/100);h+=`<div class="card" style="background:var(--accent-soft);box-shadow:none;margin-bottom:10px"><div class="lbl">Harga jual untuk margin ${nf(m,1)}%</div><div class="big">${rp(price)}<span class="muted" style="font-size:14px;font-weight:500">/kg</span></div><div class="muted num">Profit ${rp(price-cost)}/kg · markup ${nf((price-cost)/cost*100,1)}%</div></div>`}
  if(isFinite(p)&&p>0&&cost>0){const mg=(p-cost)/p*100;h+=`<div class="card" style="background:${mg>=0?'var(--good-soft)':'var(--bad-soft)'};box-shadow:none"><div class="lbl">Margin pada harga ${rp(p)}/kg</div><div class="big">${nf(mg,1)}%</div><div class="muted num">Profit ${rp(p-cost)}/kg · markup ${nf((p-cost)/cost*100,1)}%</div></div>`}
  if(!(isFinite(m)&&c.margin!=='')&&!(isFinite(p)&&c.price!==''))h+=`<p class="muted">Isi target margin untuk melihat harga jual, atau isi target harga jual untuk melihat margin. Margin dihitung dari harga jual.</p>`;
  el.innerHTML=h}

/* ====================== Entities ====================== */
const ENT={cust:{arr:'customers',form:formCust,l:'customer'},prod:{arr:'products',form:formProd,l:'produk'},po:{arr:'pos',form:formPO,l:'PO'},act:{arr:'activities',form:formAct,l:'aktivitas'},plan:{arr:'plans',form:formPlan,l:'rencana'},pipe:{arr:'pipeline',form:formPipe,l:'pipeline'},out:{arr:'outstanding',form:formOut,l:'data outstanding'},over:{arr:'overdue',form:formOver,l:'data overdue'},samp:{arr:'samples',form:formSamp,l:'sample'}};
function upsert(arr,o){const i=S[arr].findIndex(x=>x.id===o.id);if(i>=0)S[arr][i]=o;else S[arr].push(o)}
function delEntity(t,id){const e=ENT[t];ask(`Hapus ${e.l} ini? Tindakan ini tidak bisa dibatalkan.`,()=>{
  S[e.arr]=S[e.arr].filter(x=>x.id!==id);
  if(t==='prod')S.pos=S.pos.filter(x=>x.productId!==id);
  touch();render();toast('Data dihapus')})}

/* ---- notifications & todo modals ---- */
function openNotif(){const n=notifs();modal('Notifikasi',n.length?n.map(x=>`<div class="notif"><span class="sev ${x.sev}"></span><div style="flex:1;min-width:0">${x.text}</div><button type="button" class="link" data-act="goClose" data-page="${x.page}">Buka</button></div>`).join(''):empty('Tidak ada yang melewati atau mendekati due date.'),{foot:'<button type="button" class="btn" data-act="closeModal">Tutup</button>',noFocus:true})}
function openTodo(){
  modal('To do list',`<div class="tdl">${S.todos.map(t=>`<div class="it ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} data-act="todoTog" data-id="${t.id}" aria-label="Selesai"><span>${esc(t.text)}</span><button type="button" class="btn sm danger" data-act="todoDel" data-id="${t.id}">Hapus</button></div>`).join('')||empty('Belum ada tugas.')}</div>
   <div class="row" style="flex-wrap:nowrap"><input name="t" id="todoNew" placeholder="Tambah tugas baru, lalu Enter" style="flex:1"><button class="btn primary" style="flex:none">Tambah</button></div>`,
   {foot:'<button type="button" class="btn" data-act="closeModal">Selesai</button>',onSubmit:fd=>{const t=String(fd.get('t')).trim();if(t){S.todos.push({id:uid(),text:t,done:false});touch();renderLock();render();openTodo()}return false}})}

/* ====================== Render ====================== */
const PAGES={dash:pageDash,budget:pageBudget,cust:pageCust,prod:pageProd,act:pageAct,pipe:pagePipe,out:pageOut,over:pageOver,samp:pageSamp,calc:pageCalc};
function renderSide(){$('#side').innerHTML=`<div class="brand"><i>CRM</i>Adit CRM</div>`+NAV.map(([k,l])=>`<button class="nav" data-act="go" data-page="${k}" data-nav="${k}">${svg(k)}<span>${l}</span></button>`).join('')}
function render(){
  const ae=document.activeElement,aid=ae&&ae.id,ss=ae&&ae.selectionStart,se=ae&&ae.selectionEnd;
  const keep={};$$('[data-keepscroll]').forEach(e=>keep[e.dataset.keepscroll]=e.scrollLeft);
  const main=$('#main'),st=main.scrollTop;
  $('#view').innerHTML=PAGES[UI.page]();
  $$('[data-keepscroll]').forEach(e=>{if(keep[e.dataset.keepscroll]!==undefined)e.scrollLeft=keep[e.dataset.keepscroll]});
  if(UI.page==='act'&&UI.scrollNow){const w=$('#weeks'),n=$('[data-now]');if(w&&n)w.scrollLeft=Math.max(0,n.offsetLeft-w.offsetLeft-12);UI.scrollNow=false}
  main.scrollTop=st;
  if(aid){const e=document.getElementById(aid);if(e&&e!==document.activeElement){e.focus();try{if(ss!=null)e.setSelectionRange(ss,se)}catch(x){}}}
  main.classList.toggle('fit',['cust','prod','out','over','samp'].includes(UI.page));$('#tip').hidden=true;
  const navKey=UI.page==='budget'?'dash':UI.page;
  $$('.nav').forEach(b=>b.classList.toggle('on',b.dataset.nav===navKey));
  $('#pageTitle').textContent=TITLES[UI.page];
  const nn=notifs().length;$('#bell').innerHTML=svg('bell')+(nn?`<span class="badge">${nn}</span>`:'');
  $('#lockBtn').innerHTML=svg('lock');
  $('#banner').innerHTML=cfg.demo?`<div class="banner"><span>Ini data contoh supaya tampilan terlihat hidup. Hapus sebelum mulai mengisi data asli.</span><button class="btn sm" data-act="clearDemo">Hapus data contoh</button></div>`:'';
  if(UI.page==='calc')calcUpdate();
}

/* ====================== Events ====================== */
const ACTIONS={
 go:d=>{UI.page=d.page;if(d.page==='act')UI.scrollNow=true;$('#main').scrollTop=0;render()},
 goClose:d=>{closeModal();ACTIONS.go(d)},
 closeModal,
 openBudget:d=>{UI.bud=d.m;UI.page='budget';$('#main').scrollTop=0;render()},
 bud:d=>{UI.bud=d.m;render()},
 saveNow:()=>{persist();pushSheet(true).then(ok=>{if(!cfg.url)toast('Tersimpan di perangkat ini. Hubungkan Google Sheet untuk sinkronisasi.')})},
 add:(d)=>ENT[d.t].form(null,d),
 edit:(d)=>ENT[d.t].form(d.id,d),
 del:(d)=>delEntity(d.t,d.id),
 sort:d=>{const s=UI[d.p].sort;if(s.k===d.k)s.dir=s.dir==='asc'?'desc':'asc';else{s.k=d.k;s.dir='asc'}render()},
 selProd:d=>{UI.prod.sel=d.id;UI.po.cust='';UI.po.month='';render()},
 mv:d=>{const p=S.pipeline.find(x=>x.id===d.id);const i=STAGES.findIndex(s=>s.k===p.status)+N(d.d);if(i>=0&&i<STAGES.length){p.status=STAGES[i].k;touch();render()}},
 stageInfo:d=>{const s=STG[d.k];modal(s.l,`<div class="stack" style="gap:12px"><div><div class="lbl">Aktivitas</div><div>${esc(s.act)}</div></div><div><div class="lbl">Status PO</div><div>${esc(s.po)}</div></div><div><div class="lbl">Probability</div><div class="big sm">${s.p}%</div></div></div>`,{foot:'<button type="button" class="btn" data-act="closeModal">Tutup</button>',noFocus:true})},
 addContact:()=>$('#contacts').insertAdjacentHTML('beforeend',contactBlock()),
 addPhone:(d,el)=>el.closest('.cblock').querySelector('.phones').insertAdjacentHTML('beforeend',phoneRow()),
 rmPhone:(d,el)=>{const box=el.closest('.phones');if(box.children.length>1)el.closest('.phone-row').remove();else box.querySelector('input').value=''},
 rmContact:(d,el)=>{const box=$('#contacts');if(box.children.length>1)el.closest('.cblock').remove();else{const b=el.closest('.cblock');$$('input',b).forEach(i=>i.value='');$('.c-role',b).value='';$$('.phone-row',b).slice(1).forEach(r=>r.remove())}},
 addExtra:()=>{UI.calc.extras.push({n:'Biaya lain',v:''});render()},
 rmExtra:d=>{UI.calc.extras.splice(N(d.i),1);render()},
 notif:openNotif,
 todo:openTodo,
 todoTog:d=>{const t=S.todos.find(x=>x.id===d.id);t.done=!t.done;touch();renderLock();render();openTodo()},
 todoDel:d=>{S.todos=S.todos.filter(x=>x.id!==d.id);touch();renderLock();render();openTodo()},
 clearDemo:()=>ask('Hapus semua data contoh? Semua data yang sekarang tampil akan dikosongkan.',()=>{S=blank();ensureBudget();cfg.demo=false;jset(LSC,cfg);touch();render()},'Hapus semua'),
 lock:()=>{try{sessionStorage.removeItem('crm_unlocked')}catch(e){}showLock()},
 sheetCfg:()=>modal('Hubungkan Google Sheet',`<p class="muted">Tempel URL Web App dari Google Apps Script (berakhiran /exec). Langkah lengkap ada di file apps-script-crm.gs.</p>${fld('URL Web App',`<input name="url" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(cfg.url)}">`)}
   <div class="row"><button type="button" class="btn" data-act="pull">Muat dari Sheet</button><button type="button" class="btn" data-act="pushNow">Simpan ke Sheet</button></div>`,{submit:'Simpan URL',noFocus:true,onSubmit:fd=>{cfg.url=String(fd.get('url')).trim();jset(LSC,cfg);setSync(cfg.url?'dirty':'local');toast(cfg.url?'URL tersimpan. Tekan Simpan ke Sheet untuk mencoba.':'Koneksi Google Sheet dilepas')}}),
 pull:async()=>{const u=$('#mform input[name=url]');if(u){cfg.url=u.value.trim();jset(LSC,cfg)}const ok=await pullSheet();if(ok){closeModal();render();renderLock()}},
 pushNow:async()=>{const u=$('#mform input[name=url]');if(u){cfg.url=u.value.trim();jset(LSC,cfg)}if(await pushSheet(true))closeModal()}
};
function setPath(o,path,v){const k=path.split('.');let t=o;for(let i=0;i<k.length-1;i++)t=t[k[i]];t[k[k.length-1]]=v}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;
  if(t.tagName==='INPUT'&&t.type==='checkbox'&&e.type==='click'){}
  const f=ACTIONS[t.dataset.act];if(f){f(t.dataset,t,e)}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.pcard,.kc.click')){e.preventDefault();e.target.click()}});
function onField(e){const t=e.target;
  if(t.dataset.bind){setPath(UI,t.dataset.bind,t.value);if(t.dataset.bind==='po.cust'||t.dataset.bind==='po.month'){}render();return}
  if(t.dataset.bud){const [f,i]=t.dataset.bud.split(':');let b=S.budget.find(x=>x.metric===UI.bud&&x.m===+i);if(!b){b={id:UI.bud+'-'+i,metric:UI.bud,m:+i,target:0,ach:0};S.budget.push(b)}b[f]=N(t.value);touch();render();return}
  if(t.dataset.calc){const [k,i]=t.dataset.calc.split(':');if(k==='xn')UI.calc.extras[+i].n=t.value;else if(k==='xv')UI.calc.extras[+i].v=t.value;else UI.calc[k]=t.value;calcUpdate()}}
document.addEventListener('pointermove',e=>{const tip=$('#tip'),h=e.target.closest&&e.target.closest('.hit');
  if(!h||!BUD){tip.hidden=true;return}
  const i=+h.dataset.i,t=BUD.t[i],a=BUD.a[i];
  tip.innerHTML=`<b>${FYM[i]} ${i<6?FY:FY+1}</b><br>Budget: ${rp(t)}<br>Achievement: ${rp(a)}<br>${t?(a/t*100).toFixed(1)+'% dari budget':'Budget belum diisi'}`;
  tip.hidden=false;let x=e.clientX+14,y=e.clientY+14;
  if(x+tip.offsetWidth>innerWidth-8)x=e.clientX-tip.offsetWidth-14;if(y+tip.offsetHeight>innerHeight-8)y=e.clientY-tip.offsetHeight-14;
  tip.style.left=Math.max(8,x)+'px';tip.style.top=Math.max(8,y)+'px'});
document.addEventListener('input',e=>{if(e.target.matches('[data-bind][type=search],[data-bud],[data-calc]'))onField(e)});
document.addEventListener('change',e=>{if(e.target.matches('select[data-bind]'))onField(e)});

/* ====================== Lockscreen ====================== */
function renderLock(){
  const now=new Date();
  $('#lDate').textContent=`${DAYF[now.getDay()]}, ${now.getDate()} ${MONF[now.getMonth()]}`;
  $('#lTime').textContent=pad(now.getHours())+':'+pad(now.getMinutes());
  // calendar
  const y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1),lead=(first.getDay()+6)%7,dim=new Date(y,m+1,0).getDate();
  const due=new Set();[...S.overdue.map(o=>o.due),...S.samples.filter(s=>s.status==='trial').map(s=>s.due),...S.pipeline.filter(p=>!['win','lost'].includes(p.status)).map(p=>p.closing)].forEach(s=>{const d=parseD(s);if(d&&d.getFullYear()===y&&d.getMonth()===m)due.add(d.getDate())});
  let c=`<div class="cal-title"><span>${MONF[m]} ${y}</span></div><div class="cal">${['S','S','R','K','J','S','M'].map(x=>`<b>${x}</b>`).join('')}`;
  for(let i=0;i<lead;i++)c+='<span></span>';
  for(let d=1;d<=dim;d++)c+=`<span class="${d===now.getDate()?'today':''} ${due.has(d)?'dot':''}">${d}</span>`;
  $('#lCal').innerHTML=c+'</div>';
  const doy=Math.floor((now-new Date(y,0,0))/864e5);$('#lQuote').textContent=QUOTES[doy%QUOTES.length];
  const open=S.todos.filter(t=>!t.done).slice(0,8);
  $('#lTodo').innerHTML=S.todos.length?S.todos.slice(0,8).map(t=>`<label class="${t.done?'done':''}"><input type="checkbox" data-lt="${t.id}" ${t.done?'checked':''}><span>${esc(t.text)}</span></label>`).join(''):'<small>Belum ada tugas. Tambahkan dari Dashboard.</small>';
}
$('#lTodo').addEventListener('change',e=>{const id=e.target.dataset.lt;if(!id)return;const t=S.todos.find(x=>x.id===id);t.done=e.target.checked;touch();renderLock()});
async function loadKurs(){
  const box=$('#lKurs'),cache=jget('crm_adit_kurs');
  const draw=(r,note)=>{box.innerHTML=[['USD',r.USD],['CNY',r.CNY],['EUR',r.EUR]].map(([k,v])=>`<div><span>${k}</span><strong>${nf(v,0)}</strong></div>`).join('')+`<small>${note}</small>`};
  const today=iso(new Date());
  if(cache&&cache.date===today){draw(cache.r,'IDR · diperbarui hari ini');return}
  if(cache)draw(cache.r,'IDR · data terakhir '+fdate(cache.date));else box.innerHTML='<small>Memuat kurs…</small>';
  try{const r=await fetch('https://open.er-api.com/v6/latest/USD');const j=await r.json();if(j.result!=='success')throw 0;const x=j.rates;
    const o={USD:x.IDR,CNY:x.IDR/x.CNY,EUR:x.IDR/x.EUR};jset('crm_adit_kurs',{date:today,r:o});draw(o,'IDR · diperbarui hari ini')}
  catch(e){if(!cache)box.innerHTML='<small>Kurs belum bisa dimuat. Periksa koneksi internet.</small>'}}
let clockT=null;
function showLock(){$('#lock').hidden=false;$('#app').hidden=true;$('#pw').value='';$('#lockMsg').textContent='';renderLock();loadKurs();clearInterval(clockT);clockT=setInterval(renderLock,20000);setTimeout(()=>$('#pw').focus(),50)}
async function unlock(){
  $('#lock').hidden=true;$('#app').hidden=false;clearInterval(clockT);
  try{sessionStorage.setItem('crm_unlocked','1')}catch(e){}
  render();if(cfg.url&&!unlock.done){unlock.done=true;await pullSheet(true);render()}}
$('#unlockForm').addEventListener('submit',e=>{e.preventDefault();
  if($('#pw').value===PASSWORD)unlock();
  else{const b=$('#pwBox');$('#lockMsg').textContent='Kata sandi belum tepat, coba lagi.';b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');$('#pw').select()}});

/* ====================== Boot ====================== */
(function boot(){
  const saved=jget(LS);
  if(saved){S=norm(saved)}
  else{S=demo();cfg.demo=true;jset(LSC,cfg);persist()}
  ensureBudget();renderSide();setSync(cfg.url?'saved':'local');
  let open=false;try{open=sessionStorage.getItem('crm_unlocked')==='1'}catch(e){}
  if(open)unlock();else showLock();
})();
</script>
